<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Karla:wght@400;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: Karla, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #0e6b85; } a:hover { color: #094c5f; }
  </style>
</helmet>

<!-- 400 × 711 = 1080 × 1920. La firma del informe.
     El color de cada bloque es el ELEMENTO de ese signo, así que la
     tarjeta es un retrato de color de la persona: bilbao sale dos
     tercios azul, y eso concuerda con su AGUA 98. El color dice algo
     verdadero en vez de decorar. -->
<div style="width: 400px; height: 711px; background: #faf7f2; padding: 22px 20px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; color: #14120e; overflow: hidden;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px;">
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 13px; font-weight: 700; color: #14120e;">La carta de {{nombre}}</div>
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9a9284;">Tu firma</div>
  </div>

  <!-- El Sol manda: bloque dominante -->
  <div style="background: {{sol.color}}; border-radius: 28px; padding: 24px 22px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1;">
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.75);">Sol</div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 60px; line-height: 0.88; letter-spacing: -0.045em; color: #ffffff; overflow-wrap: break-word;">{{sol.sign}}</div>
      <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.72);">{{sol.element}}</div>
    </div>
  </div>

  <!-- Luna y Ascendente comparten fila -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex-grow: 1;">
    <sc-for list="{{otros}}" as="o" hint-placeholder-count="2">
      <div style="background: {{o.color}}; border-radius: 28px; padding: 20px 18px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.75);">{{o.label}}</div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 34px; line-height: 0.9; letter-spacing: -0.04em; color: #ffffff; overflow-wrap: break-word;">{{o.sign}}</div>
          <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(255,255,255,0.72);">{{o.element}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- La estadística. Calculada por signature(), nunca inventada. -->
  <div style="background: #14120e; border-radius: 28px; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.035em; color: #ffffff;">1 de {{combinaciones}}</div>
      <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 12px; font-weight: 600; color: #8d8579;">combinaciones posibles</div>
    </div>
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 700; line-height: 1.3; text-align: right; color: #c9a227; flex-shrink: 0; white-space: pre-line;">{{aguaNota}}</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px;">
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #9a9284;">Destiny Reports</div>
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #9a9284;">[TU DOMINIO]</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"nombre":{"editor":"text","default":"Carlos","section":"Carta"},"$preview":{"width":400,"height":711}}'>
class Component extends DCLogic {
  renderVals() {
    // bilbao-2000, del motor: Sol Leo, Luna Cáncer, Ascendente Piscis.
    // signature().oneIn = 12 × 12 × 12.
    return {
      nombre: this.props.nombre ?? 'Carlos',
      combinaciones: (12 * 12 * 12).toLocaleString('es-ES'),
      sol:   { sign: 'Leo',    element: 'Fuego', color: '#e2571e' },
      otros: [
        { label: 'Luna',       sign: 'Cáncer', element: 'Agua', color: '#0e6b85' },
        { label: 'Ascendente', sign: 'Piscis', element: 'Agua', color: '#0e6b85' }
      ],
      aguaNota: 'Dos de tres\nen agua'
    };
  }
}
</script>
</body>
</html>
