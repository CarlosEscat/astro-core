<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Karla:wght@400;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: Karla, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #0e6b85; } a:hover { color: #094c5f; }
  </style>
</helmet>

<!-- 400 × 711 = 1080 × 1920 exacto. Render propio, no captura del DOM:
     el tipo sube de escala para que se lea en miniatura, y no hay CTA,
     ni filas bloqueadas, ni nada que huela a anuncio dentro del marco. -->
<div style="width: 400px; height: 711px; background: #faf7f2; padding: 20px 18px; display: flex; flex-direction: column; gap: 11px; box-sizing: border-box; color: #14120e; overflow: hidden;">

  <!-- La clase -->
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px;">
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #9a9284;">Tu personaje</div>
    <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 52px; line-height: 0.9; letter-spacing: -0.04em; color: #14120e; overflow-wrap: break-word;">ARTISTA</div>
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: 600; line-height: 1.3; color: #4a4438; text-wrap: pretty;">necesita público hasta para estar en su casa</div>
  </div>

  <!-- La frase: el héroe del cuadro -->
  <div style="background: {{accent}}; border-radius: 26px; padding: 22px 20px;">
    <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.022em; color: #ffffff; text-wrap: pretty;">Tu personaje habla en indirectas, se cura llorando en su cuarto y su punto débil es pagar impuestos.</div>
  </div>

  <!-- Stats, versión compacta: nombre, número y barra en una sola fila -->
  <div style="background: #ffffff; border-radius: 26px; padding: 15px 20px; display: flex; flex-direction: column; gap: 9px;">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 54px; font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #14120e;">{{s.name}}</div>
        <div style="flex-grow: 1; height: 6px; background: #f0ece4; border-radius: 999px; overflow: hidden; display: flex;">
          <div style="width: {{s.pct}}; background: {{s.color}};"></div>
        </div>
        <div style="width: 38px; text-align: right; font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: {{s.color}};">{{s.value}}</div>
      </div>
    </sc-for>
  </div>

  <!-- El realce -->
  <div style="background: #14120e; border-radius: 26px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #c98a5e;">Su punto débil</div>
    <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-size: 25px; font-weight: 600; line-height: 1.14; letter-spacing: -0.025em; color: #ffffff; text-wrap: pretty;">Pagar impuestos.</div>
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 600; color: #8d8579;">Tierra 6 · menos tierra que el 94% de la gente</div>
  </div>

  <!-- Firma. Lo único que no es carta: sin CTA, sin candados. -->
  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 6px;">
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #9a9284;">Destiny Reports</div>
    <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #9a9284;">[TU DOMINIO]</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0e6b85","options":["#0e6b85","#c2410c","#4d7c0f","#7c3aed"],"section":"Tema"},"$preview":{"width":400,"height":711}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#0e6b85',
      stats: [
        { name: 'AGUA',   value: 98, pct: '98%', color: '#0e6b85' },
        { name: 'FUEGO',  value: 54, pct: '54%', color: '#e2571e' },
        { name: 'AIRE',   value: 12, pct: '12%', color: '#c9a227' },
        { name: 'TIERRA', value: 6,  pct: '6%',  color: '#8a6240' }
      ]
    };
  }
}
</script>
</body>
</html>
