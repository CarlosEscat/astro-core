<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Karla:wght@400;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: Karla, "Helvetica Neue", system-ui, sans-serif; }
    a { color: #0e6b85; } a:hover { color: #094c5f; }
  </style>
</helmet>

<div style="width: 400px; background: #faf7f2; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; color: #14120e;">

  <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #9a9284; padding: 4px 6px 0;">Destiny Reports · tu informe</div>

  <!-- El saludo -->
  <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 13px; font-weight: 600; line-height: 1.45; color: #7a7466; padding: 0 6px; text-wrap: pretty;">Para Carlos, a partir de la carta que calculamos con tus datos.</div>

  <!-- El índice: ocho secciones, ~3.000 palabras. Es la promesa de tamaño. -->
  <div style="background: #ffffff; border-radius: 28px; padding: 20px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
      <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #9a9284;">Tu informe</div>
      <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9284;">8 secciones</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3px;">
      <sc-for list="{{indice}}" as="s" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid #f0ece4; min-height: 44px; box-sizing: border-box;">
          <div style="width: 22px; flex-shrink: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: -0.03em; color: {{s.color}};">{{s.n}}</div>
          <div style="flex-grow: 1; font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 14.5px; font-weight: 600; line-height: 1.3; color: #14120e; text-wrap: pretty;">{{s.title}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Una sección. El color de la barra la ata al índice: es la única
       señal de sitio en una lectura de quince minutos. -->
  <div style="display: flex; flex-direction: column; gap: 13px; padding: 8px 6px 0;">

    <div style="display: flex; align-items: center; gap: 11px;">
      <div style="width: 34px; height: 5px; border-radius: 999px; background: {{accent}}; flex-shrink: 0;"></div>
      <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #9a9284;">Sección 3 de 8</div>
    </div>

    <div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-size: 29px; font-weight: 800; line-height: 1.02; letter-spacing: -0.035em; color: #14120e; text-wrap: balance;">Tu mundo emocional</div>

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <sc-for list="{{parrafos}}" as="p" hint-placeholder-count="3">
        <div style="font-family: Karla, 'Helvetica Neue', sans-serif; font-size: 16px; font-weight: 400; line-height: 1.62; color: #2f2b23; text-wrap: pretty;">{{p.text}}</div>
      </sc-for>
    </div>

  </div>

  <!-- El salto a la siguiente sección -->
  <div style="background: #ffffff; border-radius: 28px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: Karla, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9a9284;">Sigue</div>
      <div style="font-family: Karla, sans-serif; font-size: 14.5px; font-weight: 700; color: #14120e;">La puerta por la que entras al mundo</div>
    </div>
    <div style="width: 34px; height: 34px; border-radius: 999px; background: #f0ece4; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#14120e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="3" x2="8" y2="13"></line>
        <polyline points="4,9 8,13 12,9"></polyline>
      </svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0e6b85","options":["#0e6b85","#c2410c","#4d7c0f","#7c3aed"],"section":"Tema"},"$preview":{"width":400,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#0e6b85',
      indice: [
        { n: 1, title: 'Tu retrato esencial', color: '#e2571e' },
        { n: 2, title: 'El corazón de tu identidad', color: '#e2571e' },
        { n: 3, title: 'Tu mundo emocional', color: '#0e6b85' },
        { n: 4, title: 'La puerta por la que entras al mundo', color: '#c9a227' },
        { n: 5, title: 'Amor y vínculos', color: '#0e6b85' },
        { n: 6, title: 'Vocación y propósito', color: '#8a6240' },
        { n: 7, title: 'Tus luces y tus sombras', color: '#8a6240' },
        { n: 8, title: 'Claves para tu camino', color: '#c9a227' }
      ],
      parrafos: [
        { text: 'Tu Luna está en Cáncer, a cuatro grados y medio, en la cuarta casa. Es la posición más cerrada y más doméstica que puede ocupar: la parte de ti que siente se retira a casa para hacerlo, y no le gusta que la miren mientras.' },
        { text: 'Eso explica algo que probablemente te han dicho más de una vez. Te cuesta poco escuchar y mucho contar. No es desconfianza; es que necesitas el sitio adecuado, y el sitio adecuado casi siempre es el tuyo.' },
        { text: 'Con Mercurio también en Cáncer, a dieciséis grados, la manera de decir las cosas hereda el mismo pudor. Hablas en rodeos cuando el asunto importa de verdad, y en directo cuando no. La gente que te conoce bien ya sabe leer esa diferencia.' }
      ]
    };
  }
}
</script>
</body>
</html>
